<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="css/styles.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Find -Kakao clone</title>
  </head>
  <body>
    <div class="status-bar">
      <div class="status-bar__column">
        <span>No Service</span>
        <i class="fas fa-wifi"></i>
      </div>

      <div class="status-bar__column">
        <span>18:43</span>
      </div>
      <div class="status-bar__column">
        <span>110%</span>
        <i class="fas fa-battery-full"></i>
        <i class="fas fa-bolt"></i>
      </div>
    </div>

    <header class="screen-header">
      <h1 class="screen-header_title">Find</h1>
      <div class="screen-header_icons">
        <span><i class="fa-2x fas fa-search"></i></span>
         <a href="settings.html" style="color: black; opacity: 0.8">
          <span><i class="fa-solid fa-gear fa-2x"></i></span>
        </a>
        <span class="screen_notification"></span>
      </div>
    </header>

    <main class="main-screen">
         <div class="icon-row">
            <div class="icon-row_icon">
            <i class="fa-solid fa-qrcode"></i><span>QR Code</span>
          </div>
        <div class="icon-row_icon">
          <i class="fa-regular fa-address-book"></i><span class="add_by_Contact">Add </br> by Contact</span>
        </div>
        <div class="icon-row_icon">
          <i class="fa-regular fa-id-card"></i><span>Add by ID</span>
        </div>
        <div class="icon-row_icon">
          <i class="far fa-envelope"></i><span>Invite</span>
        </div>
      </div>
      <div class="recommended-friends">
        <h6>Recommended Friends</h6>
        <span>You have no recommended friends.</span>
      </div>
      <div class="open-chat">
        <div class="open-chat_header">
          <h4 class="open-chat_title">Open Chat</h4>
          <span>Go to Openchat Home <i class="fa-solid fa-chevron-right fa-xs"></i></span>
        </div>
        <div class="open-post">
          <div class="open-post_column">
            <h5 class="open-post_title">#BTS</h5>
            <h6 class="open-post_hashtags">#bts#army#friends</h6 class="open-post_title">
            <div class="open-post_members">
              <img src="img/bts.png"/>
              <span class="open-post_member-count">802 members</span>
              <div class="divider"></div>
              <span class="open-post_member-status">Active</span>
            </div>
            
          </div>
          <div class="open-post_column">
          <div class="open-post_column">
            <div class="open-post_photo">
                 <img src="img/bts.png"/>
                 <div class="open-post_heart-count">
                 <i class="fas fa-heart fa-xs"></i>
                 <span>1 million</span>
                 </div>
            </div>
          </div>
          </div>
         </div>
         <div class="open-post">
          <div class="open-post_column">
            <h5 class="open-post_title">#BTS</h5>
            <h6 class="open-post_hashtags">#bts#army#friends</h6 class="open-post_title">
            <div class="open-post_members">
              <img src="img/bts2.png"/>
              <span class="open-post_member-count">802 members</span>
              <div class="divider"></div>
              <span class="open-post_member-status">Active</span>
            </div>
            
          </div>
          <div class="open-post_column">
          <div class="open-post_column">
            <div class="open-post_photo">
                 <img src="img/bts2.png"/>
                 <div class="open-post_heart-count">
                 <i class="fas fa-heart fa-xs"></i>
                 <span>1 million</span>
                 </div>
            </div>
          </div>
          </div>
         </div>
      
    </main>

    <nav class="nav">
      <ul class="nav_list">
        <li class="nav_btn">
          <a class="nav_link" href="friend.html"
            ><i class="far fa-user fa-2x"></i
          ></a>
        </li>
        <li class="nav_btn">
          <a class="nav_link" href="chats.html">
            <span class="nav_notification badge">1</span>
            <i class="far fa-comment fa-2x"></i
          ></a>
        </li>
        <li class="nav_btn">
          <a class="nav_link" href="find.html"
            ><i class="fa-2x fas fa-search"></i
          ></a>
        </li>
        <li class="nav_btn">
          <a class="nav_link" href="more.html"
            ><span class="nav_notification2"> </span
            ><i class="fa-2x fa-solid fa-ellipsis"></i
          ></a>
        </li>
      </ul>
    </nav>
     <div id="no-mobile">
      <span>Your Screen is bigbigbig :(</span>
    </div>
    <script
      src="https://kit.fontawesome.com/b5ac015c11.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
