<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="css/styles.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat -Kakao clone</title>
  </head>
  <body id="chat-screen">
    <div class="status-bar">
      <div class="status-bar__column">
        <span>No Service</span>
        <i class="fas fa-wifi"></i>
      </div>

      <div class="status-bar__column">
        <span>18:43</span>
      </div>
      <div class="status-bar__column">
        <span>110%</span>
        <i class="fas fa-battery-full"></i>
        <i class="fas fa-bolt"></i>
      </div>
    </div>

    <header class="alt-header">
      <div class="alt-header_column">
        <a href="chats.html" style="color: black; opacity: 0.8">
          <i class="fa-solid fa-angle-left fa-2x"></i>
        </a>
      </div>
      <div class="alt-header_column">
        <h1 class="alt-header_title">Minseok</h1>
      </div>
      <div class="alt-header_column">
        <span><i class="fa-2x fas fa-search"></i></span>
        <span><i class="fa-solid fa-bars fa-2x"></i></span>
      </div>
    </header>

    <main class="main-screen main-chat">
      <div class="chat_timestamp">Tuseday, June 30, 2020</div>
      <div class="message-row">
        <img src="img/profile.png" />
        <div class="message-row_content">
          <span class="message_author">Minseok</span>
          <div class="message-info">
            <span class="message_bubble">Hi!</span>
            <span class="message_time">11:20</span>
          </div>
        </div>
        
      </div>
      <div class="message-row message-row-own">   
        <div class="message-row_content">
          <div class="message-info">
            <span class="message_bubble">Hi! nice to meet you!</span>
            <span class="message_time">11:20</span>
          </div>
        </div>
        
      
    </main>
    <form class="reply">
            <div class="reply_column">
                <i class="fa-solid fa-square-plus"></i>
            </div>
            <div class="reply_column">  
                <input type="text" placeholder="Write a message..."/>
                <i class="fa-solid fa-face-smile"></i>
                <button>
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
            </div>

    </form>
    <div id="no-mobile">
      <span>Your Screen is bigbigbig :(</span>
    </div>
    <script
      src="https://kit.fontawesome.com/b5ac015c11.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
