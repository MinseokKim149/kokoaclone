<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="css/styles.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Friend-Kakao clone</title>
  </head>
  <body>
    <div class="status-bar">
      <div class="status-bar__column">
        <span>No Service</span>
        <i class="fas fa-wifi"></i>
      </div>

      <div class="status-bar__column">
        <span>18:03</span>
      </div>
      <div class="status-bar__column">
        <span>110%</span>
        <i class="fas fa-battery-full"></i>
        <i class="fas fa-bolt"></i>
      </div>
    </div>

    <header class="screen-header">
      <h1 class="screen-header_title">Friends</h1>
      <div class="screen-header_icons">
        <span><i class="fa-2x fas fa-search"></i></span>
        <span><i class="fa-solid fa-music fa-2x"></i></span>
        <a href="settings.html" style="color: black; opacity: 0.8">
          <span><i class="fa-solid fa-gear fa-2x"></i></span>
        </a>
      </div>
    </header>

    <a id="friend-display_link">
      <i class="fa-solid fa-circle-info"></i>
      Friend's Names Display <i class="fa-solid fa-chevron-right fa-xs"></i>
    </a>

    <main class="friends-screen">
      <div class="user-component">
        <div class="user-component_colum">
          <img src="img/profile.png" class="user-component_avatar xl" />
          <div class="user-component_text">
            <h4 class="user-component_title">Minseok</h4>
            <h6 class="user-component_subtitle">hello</h6>
          </div>
        </div>
        <div class="user-component_colum"></div>
      </div>
      <div class="friends-screen_channel">
        <div class="friends-screen_channe-header">
          <span>Channel</span>
          <i class="fa-solid fa-chevron-up fa-xs"></i>
        </div>
        <div class="user-component">
          <div class="user-component_colum">
            <img src="img/profile.png" class="user-component_avatar sm" />
            <div class="user-component_text">
              <h4 class="user-component_title user-component_title-not-bold">
                channel
              </h4>
            </div>
          </div>
          <div class="user-component_colum">
            <div>
              <span>2</span>
              <i class="fa-solid fa-chevron-right fa-sm"></i>
            </div>
          </div>
        </div>
      </div>
    </main>

    <nav class="nav">
      <ul class="nav_list">
        <li class="nav_btn">
          <a class="nav_link" href="friend.html"
            ><i class="fa-2x fa-solid fa-user"></i
          ></a>
        </li>
        <li class="nav_btn">
          <a class="nav_link" href="chats.html" style="text-decoration: none">
            <span class="nav_notification badge">1</span>
            <i class="far fa-comment fa-2x"></i
          ></a>
        </li>
        <li class="nav_btn">
          <a class="nav_link" href="find.html"
            ><i class="fa-2x fas fa-search"></i
          ></a>
        </li>
        <li class="nav_btn">
          <a class="nav_link" href="more.html"
            ><span class="nav_notification2"> </span
            ><i class="fa-2x fa-solid fa-ellipsis"></i
          ></a>
        </li>
      </ul>
    </nav>
    <div id="splash-screen">
      <i class="fas fa-comment"></i>
    </div>
    <div id="no-mobile">
      <span>Your Screen is bigbigbig :(</span>
    </div>
    <script
      src="https://kit.fontawesome.com/b5ac015c11.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
